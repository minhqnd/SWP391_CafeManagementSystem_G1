name: Build

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aura_cafe_erp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Seed database schema
        run: mysql -h 127.0.0.1 -uroot -proot aura_cafe_erp < database/aura_cafe.sql

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: aura_cafe_erp
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B test -Dinventory.test.url="jdbc:mysql://127.0.0.1:3306/aura_cafe_erp?useSSL=false&allowPublicKeyRetrieval=true"
