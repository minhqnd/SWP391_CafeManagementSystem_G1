version: '3.8'

services:
  # =====================================================
  # 1. Database Service: MySQL 8.0 (Tối ưu RAM cho VPS 1GB)
  # =====================================================
  db:
    image: mysql:8.0
    container_name: aura_cafe_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: aura_cafe_erp
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
      --default-time-zone=+07:00
      --innodb-buffer-pool-size=64M
      --max-connections=30
      --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/aura_cafe.sql:/docker-entrypoint-initdb.d/01_aura_cafe.sql:ro
      - ./database/update_menu_data.sql:/docker-entrypoint-initdb.d/02_update_menu_data.sql:ro
      - ./database/update_feedback.sql:/docker-entrypoint-initdb.d/03_update_feedback.sql:ro

  # =====================================================
  # 2. Web Application: Tomcat 10.1 + Java 17
  # =====================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_cafe_web
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: aura_cafe_erp
      DB_USER: root
      DB_PASSWORD: 1234
      TZ: Asia/Ho_Chi_Minh
      JAVA_OPTS: "-Xms128m -Xmx256m -Duser.timezone=Asia/Ho_Chi_Minh"
    ports:
      - "80:8080"
      - "8080:8080"

volumes:
  mysql_data:
